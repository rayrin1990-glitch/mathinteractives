<!DOCTYPE html>
<html>
<head>
    <title>3D Vector Magnitude Visualizer</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #f8f9fa; 
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { margin-top: 0; text-align: center; }
        
        /* Math Styling */
        .formula-display {
            background: #f1f3f5;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.4em;
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
        }

        /* Color Coding */
        .x-col { color: #e74c3c; font-weight: bold; } /* Red */
        .y-col { color: #27ae60; font-weight: bold; } /* Green */
        .z-col { color: #2980b9; font-weight: bold; } /* Blue */
        .d-col { color: #f39c12; font-weight: bold; } /* Orange */
        .m-col { color: #000000; font-weight: bold; border-bottom: 2px solid #000; } /* Black */

        #controls { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            margin-bottom: 30px;
        }
        .slider-group { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        input[type=range] { width: 100%; cursor: pointer; }

        .step-box {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        #plot { width: 100%; height: 500px; }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Vector Magnitude</h1>

    <!-- General Formula Section -->
    <div class="formula-display">
        General Formula: 
        <span class="m-col">|v|</span> = 
        &radic;(<span class="x-col">x</span>&sup2; + <span class="y-col">y</span>&sup2; + <span class="z-col">z</span>&sup2;)
    </div>
    
    <!-- Controls Section -->
    <div id="controls">
        <div class="slider-group">
            <span class="x-col">X Component</span>
            <input type="range" id="xVal" min="-10" max="10" value="6" step="0.5" oninput="update()">
            <label id="xLabel">6</label>
        </div>
        <div class="slider-group">
            <span class="y-col">Y Component</span>
            <input type="range" id="yVal" min="-10" max="10" value="4" step="0.5" oninput="update()">
            <label id="yLabel">4</label>
        </div>
        <div class="slider-group">
            <span class="z-col">Z Component</span>
            <input type="range" id="zVal" min="-10" max="10" value="5" step="0.5" oninput="update()">
            <label id="zLabel">5</label>
        </div>
    </div>

    <!-- Live Calculation Section -->
    <div class="step-box">
        <strong>Step 1: Diagonal on the Floor (XY Plane)</strong><br>
        <span class="d-col">d<sub>xy</sub></span> = &radic;(<span class="x-col" id="calc-x1">6</span>&sup2; + <span class="y-col" id="calc-y1">4</span>&sup2;) = <span class="d-col" id="calc-d1">7.21</span>
        <br><br>
        <strong>Step 2: Final 3D Magnitude</strong><br>
        <span class="m-col">Magnitude</span> = &radic;(<span class="d-col" id="calc-d2">7.21</span>&sup2; + <span class="z-col" id="calc-z1">5</span>&sup2;) = <span class="m-col" id="calc-total">8.77</span>
    </div>

    <div id="plot"></div>
</div>

<script>
function update() {
    const x = parseFloat(document.getElementById('xVal').value);
    const y = parseFloat(document.getElementById('yVal').value);
    const z = parseFloat(document.getElementById('zVal').value);

    // Update Text Labels
    document.getElementById('xLabel').innerText = x;
    document.getElementById('yLabel').innerText = y;
    document.getElementById('zLabel').innerText = z;

    // Calculations
    const floorDiag = Math.sqrt(x*x + y*y);
    const magnitude = Math.sqrt(x*x + y*y + z*z);

    // Update Step-by-Step Calculation Text
    document.getElementById('calc-x1').innerText = x;
    document.getElementById('calc-y1').innerText = y;
    document.getElementById('calc-d1').innerText = floorDiag.toFixed(2);
    document.getElementById('calc-d2').innerText = floorDiag.toFixed(2);
    document.getElementById('calc-z1').innerText = z;
    document.getElementById('calc-total').innerText = magnitude.toFixed(2);

    const data = [
        // X component (Red)
        {
            type: 'scatter3d', mode: 'lines',
            x: [0, x], y: [0, 0], z: [0, 0],
            line: { width: 8, color: '#e74c3c' },
            name: 'X component'
        },
        // Y component (Green)
        {
            type: 'scatter3d', mode: 'lines',
            x: [x, x], y: [0, y], z: [0, 0],
            line: { width: 8, color: '#27ae60' },
            name: 'Y component'
        },
        // Floor Diagonal (Orange)
        {
            type: 'scatter3d', mode: 'lines',
            x: [0, x], y: [0, y], z: [0, 0],
            line: { width: 6, color: '#f39c12', dash: 'dash' },
            name: 'Floor Diagonal (d_xy)'
        },
        // Z component (Blue)
        {
            type: 'scatter3d', mode: 'lines',
            x: [x, x], y: [y, y], z: [0, z],
            line: { width: 8, color: '#2980b9' },
            name: 'Z component'
        },
        // Main Vector (Black)
        {
            type: 'scatter3d', mode: 'lines+markers',
            x: [0, x], y: [0, y], z: [0, z],
            line: { width: 10, color: '#000000' },
            marker: { size: 4, color: '#000' },
            name: 'Vector Magnitude'
        },
        // Helper Box (Light Grey)
        {
            type: 'scatter3d', mode: 'lines',
            x: [0, x, x, 0, 0, 0, x, x, 0, 0, 0, x, x, x, x, 0],
            y: [0, 0, y, y, 0, 0, 0, y, y, y, 0, 0, 0, y, y, y],
            z: [0, 0, 0, 0, 0, z, z, z, z, 0, z, z, 0, 0, z, z],
            line: { color: '#bdc3c7', width: 1 },
            showlegend: false,
            hoverinfo: 'skip'
        }
    ];

    const layout = {
        scene: {
            xaxis: { range: [-10, 10], title: 'X' },
            yaxis: { range: [-10, 10], title: 'Y' },
            zaxis: { range: [-10, 10], title: 'Z' },
            camera: { eye: {x: 1.5, y: 1.5, z: 1.2} }
        },
        margin: { l: 0, r: 0, b: 0, t: 0 },
        legend: { x: 0, y: 1 }
    };

    Plotly.newPlot('plot', data, layout);
}

// Initialize
update();
</script>

</body>
</html>
