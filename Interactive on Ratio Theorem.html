<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Ratio Theorem: Component Labels</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 900px; width: 100%; }
        canvas { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; cursor: crosshair; display: block; margin: 0 auto; }
        .controls { background: #f1f5f9; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; }
        .slider-label { font-size: 1.3rem; margin-bottom: 15px; display: block; font-weight: bold; }
        input[type="range"] { width: 80%; cursor: pointer; height: 12px; }

        .math-box { background: #0f172a; color: #f8fafc; padding: 25px; border-radius: 12px; margin-top: 20px; font-family: 'Times New Roman', serif; display: flex; align-items: center; justify-content: center; gap: 20px; }
        .fraction { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; }
        .numerator { border-bottom: 2px solid #38bdf8; padding: 2px 10px; font-size: 1.4rem; }
        .denominator { padding: 2px 10px; font-size: 1.4rem; }
        .p-vec { font-size: 1.8rem; font-weight: bold; color: #ef4444; }
        .color-a { color: #10b981; font-weight: bold; } 
        .color-b { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0">The Vector Section Formula</h2>
    <p>Watch how the portions of <b>a</b> and <b>b</b> add up to create <b>p</b>.</p>
    
    <canvas id="canvas" width="800" height="450"></canvas>

    <div class="controls">
        <span class="slider-label">
            Ratio <span style="color:#f59e0b">m (AP)</span> = <span id="mText">3</span> | 
            Ratio <span style="color:#8b5cf6">n (PB)</span> = <span id="nText">7</span>
        </span>
        <input type="range" id="ratioSlider" min="0" max="10" step="1" value="3">
    </div>

    <div class="math-box">
        <span class="p-vec">p</span> 
        <span style="font-size:1.8rem; color:#38bdf8; margin: 0 10px;">=</span>
        <div class="fraction">
            <div class="numerator">
                <span style="color:#8b5cf6" id="formulaN">7</span><span class="color-a">a</span> + 
                <span style="color:#f59e0b" id="formulaM">3</span><span class="color-b">b</span>
            </div>
            <div class="denominator">10</div>
        </div>
        <div style="margin-left: 20px; border-left: 1px solid #334155; padding-left: 20px;">
            <div id="finalResult" style="font-size: 1.2rem; color: #38bdf8;">p = 0.7a + 0.3b</div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('ratioSlider');

    const O = { x: 80, y: 400 }; 
    let A = { x: 180, y: 100 };   
    let B = { x: 720, y: 280 };  
    let dragging = null;

    // Helper to draw text floating offset from a vector line
    function drawVectorLabel(p1, p2, text, color, offsetDir = 1) {
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len < 10) return;

        const nx = -dy / len;
        const ny = dx / len;
        
        const offset = 20 * offsetDir; 
        const labelX = midX + nx * offset;
        const labelY = midY + ny * offset;

        ctx.fillStyle = color;
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(text, labelX, labelY);
    }

    function drawArrow(from, to, color, width = 3, label = "") {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.stroke();

        const headlen = 10;
        const angle = Math.atan2(to.y - from.y, to.x - from.x);
        ctx.beginPath();
        ctx.moveTo(to.x, to.y);
        ctx.lineTo(to.x - headlen * Math.cos(angle - 0.4), to.y - headlen * Math.sin(angle - 0.4));
        ctx.lineTo(to.x - headlen * Math.cos(angle + 0.4), to.y - headlen * Math.sin(angle + 0.4));
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();

        if (label) {
            ctx.fillStyle = color;
            ctx.font = "italic 18px serif";
            ctx.textAlign = "center";
            ctx.fillText(label, (from.x + to.x)/2 - 12, (from.y + to.y)/2 - 10);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const m = parseInt(slider.value); 
        const n = 10 - m;                
        const weightA = n / 10;
        const weightB = m / 10;

        document.getElementById('mText').innerText = m;
        document.getElementById('nText').innerText = n;
        document.getElementById('formulaN').innerText = n;
        document.getElementById('formulaM').innerText = m;
        document.getElementById('finalResult').innerText = `p = ${weightA.toFixed(1)}a + ${weightB.toFixed(1)}b`;

        const P = {
            x: (n * A.x + m * B.x) / 10,
            y: (n * A.y + m * B.y) / 10
        };

        // 1. Faint Parent Vectors OA and OB
        drawArrow(O, A, "rgba(16, 185, 129, 0.2)", 2, "a");
        drawArrow(O, B, "rgba(59, 130, 246, 0.2)", 2, "b");

        // 2. Line AB with m and n labels
        ctx.beginPath();
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#f59e0b"; 
        ctx.moveTo(A.x, A.y); ctx.lineTo(P.x, P.y); ctx.stroke();
        if (m > 0) drawVectorLabel(A, P, `m = ${m}`, "#f59e0b", -1.5);

        ctx.beginPath();
        ctx.strokeStyle = "#8b5cf6"; 
        ctx.moveTo(P.x, P.y); ctx.lineTo(B.x, B.y); ctx.stroke();
        if (n > 0) drawVectorLabel(P, B, `n = ${n}`, "#8b5cf6", -1.5);

        // 3. Thick Components buildup
        const compA = { 
            x: O.x + weightA * (A.x - O.x), 
            y: O.y + weightA * (A.y - O.y) 
        };
        
        if (n > 0) {
            drawArrow(O, compA, "#10b981", 5);
            drawVectorLabel(O, compA, `${n}/10 of a`, "#10b981", 1.5);
        }
        if (m > 0) {
            drawArrow(compA, P, "#3b82f6", 5);
            drawVectorLabel(compA, P, `${m}/10 of b`, "#3b82f6", 1.5);
        }

        // 4. Resultant Red Vector p
        drawArrow(O, P, "#ef4444", 3, "p");

        // 5. Dots and Main Labels
        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        [[O, "O"], [A, "A"], [B, "B"], [P, "P"]].forEach(item => {
            const [pt, label] = item;
            ctx.beginPath(); ctx.arc(pt.x, pt.y, 6, 0, 7); ctx.fill();
            ctx.font = "bold 16px sans-serif";
            ctx.fillText(label, pt.x + 12, pt.y - 12);
        });
    }

    canvas.onmousedown = e => {
        const r = canvas.getBoundingClientRect();
        const mx = e.clientX - r.left, my = e.clientY - r.top;
        if (Math.hypot(A.x-mx, A.y-my) < 25) dragging = A;
        else if (Math.hypot(B.x-mx, B.y-my) < 25) dragging = B;
    };
    window.onmousemove = e => {
        if (dragging) {
            const r = canvas.getBoundingClientRect();
            dragging.x = e.clientX - r.left; dragging.y = e.clientY - r.top;
            draw();
        }
    };
    window.onmouseup = () => dragging = null;
    slider.oninput = draw;
    draw();
</script>
</body>
</html>
