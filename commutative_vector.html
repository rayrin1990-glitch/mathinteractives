<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cross Product Visualiser</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; display: flex; height: 100vh; }
        
        /* Sidebar for Controls */
        #sidebar {
            width: 300px;
            background-color: #252525;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        .control-group {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border-left: 5px solid #888;
        }
        
        .group-a { border-left-color: #00ccff; } /* Blue */
        .group-b { border-left-color: #00ff88; } /* Green */
        
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        
        input[type=range] { width: 100%; cursor: pointer; }
        
        .result-box {
            margin-top: auto;
            background: #442222;
            border: 1px solid #ff4444;
            padding: 10px;
            border-radius: 5px;
        }

        .value-display { font-family: monospace; color: #ccc; }

        /* The 3D Canvas */
        #canvas-container { flex-grow: 1; position: relative; }
        
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 0.9rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- SIDEBAR CONTROLS -->
    <div id="sidebar">
        <h2>Vector Controls</h2>
        
        <!-- Vector A Controls -->
        <div class="control-group group-a">
            <strong>Vector A (Blue)</strong>
            <div>
                <label>x: <span id="val-ax" class="value-display">2</span></label>
                <input type="range" id="ax" min="-5" max="5" step="0.1" value="2">
            </div>
            <div>
                <label>y: <span id="val-ay" class="value-display">0</span></label>
                <input type="range" id="ay" min="-5" max="5" step="0.1" value="0">
            </div>
            <div>
                <label>z: <span id="val-az" class="value-display">0</span></label>
                <input type="range" id="az" min="-5" max="5" step="0.1" value="0">
            </div>
        </div>

        <!-- Vector B Controls -->
        <div class="control-group group-b">
            <strong>Vector B (Green)</strong>
            <div>
                <label>x: <span id="val-bx" class="value-display">0</span></label>
                <input type="range" id="bx" min="-5" max="5" step="0.1" value="0">
            </div>
            <div>
                <label>y: <span id="val-by" class="value-display">2</span></label>
                <input type="range" id="by" min="-5" max="5" step="0.1" value="2">
            </div>
            <div>
                <label>z: <span id="val-bz" class="value-display">0</span></label>
                <input type="range" id="bz" min="-5" max="5" step="0.1" value="0">
            </div>
        </div>

        <div class="result-box">
            <strong>Resultant (Red)</strong><br>
            <small>a &times; b</small>
            <div id="result-coords" class="value-display" style="margin-top:5px;">(0, 0, 4)</div>
            <div id="result-mag" class="value-display">Magnitude: 4.00</div>
        </div>

        <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">
            Instructions:<br>
            1. Drag sliders to change vectors.<br>
            2. Click & Drag background to rotate view.<br>
            3. Scroll to zoom.
        </p>
    </div>

    <!-- 3D VIEWPORT -->
    <div id="canvas-container">
        <div id="legend">
            <div class="legend-item"><div class="dot" style="background:#00ccff"></div>Vector A</div>
            <div class="legend-item"><div class="dot" style="background:#00ff88"></div>Vector B</div>
            <div class="legend-item"><div class="dot" style="background:#ff4444"></div>Cross Product</div>
        </div>
    </div>

    <script>
        // --- 1. SETUP SCENE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, container.offsetWidth / container.offsetHeight, 0.1, 1000);
        camera.position.set(8, 8, 12); // Initial camera position
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.offsetWidth, container.offsetHeight);
        container.appendChild(renderer.domElement);

        // Orbit Controls (Mouse rotation)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. HELPERS (Grid, Axes) ---
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(2);
        scene.add(axesHelper);

        // Lighting (Ambient + Directional)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- 3. VECTORS LOGIC ---
        
        // Arrow Helper Wrapper function
        function createArrow(color, name) {
            const dir = new THREE.Vector3(1, 0, 0);
            const origin = new THREE.Vector3(0, 0, 0);
            const length = 1;
            // hex color
            return new THREE.ArrowHelper(dir, origin, length, color, 0.3, 0.2);
        }

        // Create the 3 arrows
        const arrowA = createArrow(0x00ccff); // Blue
        const arrowB = createArrow(0x00ff88); // Green
        const arrowRes = createArrow(0xff4444); // Red

        scene.add(arrowA);
        scene.add(arrowB);
        scene.add(arrowRes);

        // The Plane Mesh (Transparent triangle to show the plane of A and B)
        const planeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffffff, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.1 
        });
        const planeGeometry = new THREE.BufferGeometry();
        const planeMesh = new THREE.Mesh(planeGeometry, planeMaterial);
        scene.add(planeMesh);


        // --- 4. UPDATE FUNCTION ---
        function updateVectors() {
            // Get values from sliders
            const ax = parseFloat(document.getElementById('ax').value);
            const ay = parseFloat(document.getElementById('ay').value);
            const az = parseFloat(document.getElementById('az').value);
            
            const bx = parseFloat(document.getElementById('bx').value);
            const by = parseFloat(document.getElementById('by').value);
            const bz = parseFloat(document.getElementById('bz').value);

            // Update text displays
            document.getElementById('val-ax').innerText = ax;
            document.getElementById('val-ay').innerText = ay;
            document.getElementById('val-az').innerText = az;
            document.getElementById('val-bx').innerText = bx;
            document.getElementById('val-by').innerText = by;
            document.getElementById('val-bz').innerText = bz;

            // Create ThreeJS Vectors
            const vecA = new THREE.Vector3(ax, ay, az);
            const vecB = new THREE.Vector3(bx, by, bz);
            
            // Calculate Cross Product
            const vecRes = new THREE.Vector3().copy(vecA).cross(vecB);

            // Update Arrow A
            const lenA = vecA.length();
            if(lenA > 0.01) {
                arrowA.setDirection(vecA.normalize());
                arrowA.setLength(lenA, 0.3, 0.2);
                arrowA.visible = true;
            } else { arrowA.visible = false; }

            // Update Arrow B
            const lenB = vecB.length();
            if(lenB > 0.01) {
                arrowB.setDirection(vecB.normalize());
                arrowB.setLength(lenB, 0.3, 0.2);
                arrowB.visible = true;
            } else { arrowB.visible = false; }

            // Update Resultant Arrow
            const lenRes = vecRes.length();
            if(lenRes > 0.01) {
                arrowRes.setDirection(vecRes.normalize());
                arrowRes.setLength(lenRes, 0.4, 0.3); // Make head slightly bigger
                arrowRes.visible = true;
            } else { arrowRes.visible = false; }

            // Update Text Results
            // Re-calc raw cross product for text display (since we normalized the vectors above)
            const rawCross = new THREE.Vector3(ax, ay, az).cross(new THREE.Vector3(bx, by, bz));
            document.getElementById('result-coords').innerText = 
                `(${rawCross.x.toFixed(1)}, ${rawCross.y.toFixed(1)}, ${rawCross.z.toFixed(1)})`;
            document.getElementById('result-mag').innerText = 
                `Magnitude: ${rawCross.length().toFixed(2)}`;

            // Update the Plane Visualisation
            // The plane is a triangle: Origin -> Tip A -> Tip B -> Origin
            const vertices = new Float32Array([
                0, 0, 0,
                ax, ay, az,
                bx, by, bz
            ]);
            planeGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
        }

        // --- 5. EVENT LISTENERS ---
        const inputs = document.querySelectorAll('input[type=range]');
        inputs.forEach(input => {
            input.addEventListener('input', updateVectors);
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = container.offsetWidth / container.offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.offsetWidth, container.offsetHeight);
        });

        // --- 6. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        updateVectors();
        animate();

    </script>
</body>
</html>
