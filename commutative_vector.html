<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cross Product Visualiser</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; display: flex; height: 100vh; }
        
        #sidebar {
            width: 300px;
            background-color: #252525;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            overflow-y: auto;
        }

        h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        .control-group {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border-left: 5px solid #888;
        }
        
        .group-a { border-left-color: #00ccff; } 
        .group-b { border-left-color: #00ff88; } 
        
        label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        .result-box {
            margin-top: auto;
            background: #442222;
            border: 1px solid #ff4444;
            padding: 10px;
            border-radius: 5px;
        }

        .value-display { font-family: monospace; color: #ccc; }
        #canvas-container { flex-grow: 1; position: relative; }
        
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 0.9rem; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h2>Vector Controls</h2>
        
        <!-- Vector a Controls (Starts on X-axis) -->
        <div class="control-group group-a">
            <strong>Vector a (Blue)</strong>
            <div>
                <label>x: <span id="val-ax" class="value-display">3</span></label>
                <input type="range" id="ax" min="-5" max="5" step="0.1" value="3">
            </div>
            <div>
                <label>y: <span id="val-ay" class="value-display">0</span></label>
                <input type="range" id="ay" min="-5" max="5" step="0.1" value="0">
            </div>
            <div>
                <label>z: <span id="val-az" class="value-display">0</span></label>
                <input type="range" id="az" min="-5" max="5" step="0.1" value="0">
            </div>
        </div>

        <!-- Vector b Controls (Starts on Y-axis) -->
        <div class="control-group group-b">
            <strong>Vector b (Green)</strong>
            <div>
                <label>x: <span id="val-bx" class="value-display">0</span></label>
                <input type="range" id="bx" min="-5" max="5" step="0.1" value="0">
            </div>
            <div>
                <label>y: <span id="val-by" class="value-display">3</span></label>
                <input type="range" id="by" min="-5" max="5" step="0.1" value="3">
            </div>
            <div>
                <label>z: <span id="val-bz" class="value-display">0</span></label>
                <input type="range" id="bz" min="-5" max="5" step="0.1" value="0">
            </div>
        </div>

        <div class="result-box">
            <strong>Resultant (Red)</strong><br>
            <small>a &times; b</small>
            <div id="result-coords" class="value-display" style="margin-top:5px;">(0, 0, 9)</div>
            <div id="result-mag" class="value-display">Magnitude: 9.00</div>
        </div>
        
        <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">
            Note: By default, <i>a</i> is on the <i>x</i>-axis and <i>b</i> is on the <i>y</i>-axis.
        </p>
    </div>

    <div id="canvas-container">
        <div id="legend">
            <div class="legend-item"><div class="dot" style="background:#00ccff"></div>Vector a</div>
            <div class="legend-item"><div class="dot" style="background:#00ff88"></div>Vector b</div>
            <div class="legend-item"><div class="dot" style="background:#ff4444"></div>a &times; b</div>
        </div>
    </div>

    <script>
        // --- 1. SETUP SCENE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, container.offsetWidth / container.offsetHeight, 0.1, 1000);
        camera.up.set(0, 0, 1); // Set Z as vertical
        camera.position.set(10, -10, 8); 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.offsetWidth, container.offsetHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. LABELS & AXES ---
        function createTextLabel(text, color = 'white') {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size; canvas.height = size;
            const context = canvas.getContext('2d');
            context.font = 'Italic 90px Times New Roman';
            context.fillStyle = color;
            context.textAlign = 'center';
            context.fillText(text, size/2, size/2 + 30);
            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture }));
            sprite.scale.set(0.7, 0.7, 0.7);
            return sprite;
        }

        const whiteMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
        function createAxisLine(endPos) {
            const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), endPos]);
            return new THREE.Line(geometry, whiteMat);
        }

        // x, y, z axes
        scene.add(createAxisLine(new THREE.Vector3(7, 0, 0)));
        const lx = createTextLabel('x'); lx.position.set(7.5, 0, 0); scene.add(lx);

        scene.add(createAxisLine(new THREE.Vector3(0, 7, 0)));
        const ly = createTextLabel('y'); ly.position.set(0, 7.5, 0); scene.add(ly);

        scene.add(createAxisLine(new THREE.Vector3(0, 0, 7)));
        const lz = createTextLabel('z'); lz.position.set(0, 0, 7.5); scene.add(lz);

        // Vector labels
        const labelA = createTextLabel('a', '#00ccff');
        const labelB = createTextLabel('b', '#00ff88');
        scene.add(labelA, labelB);

        // Grid on XY Plane
        const gridHelper = new THREE.GridHelper(20, 20, 0x333333, 0x222222);
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, -10, 15);
        scene.add(dirLight);

        // --- 3. VECTORS & AREA ---
        function createArrow(color) {
            return new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, color, 0.3, 0.2);
        }
        const arrowA = createArrow(0x00ccff); 
        const arrowB = createArrow(0x00ff88); 
        const arrowRes = createArrow(0xff4444); 
        scene.add(arrowA, arrowB, arrowRes);

        // Parallelogram to show the area/plane spanned by a and b
        const paraMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.1 });
        const paraGeometry = new THREE.BufferGeometry();
        const paraMesh = new THREE.Mesh(paraGeometry, paraMaterial);
        scene.add(paraMesh);

        // --- 4. UPDATE FUNCTION ---
        function updateVectors() {
            const ax = parseFloat(document.getElementById('ax').value);
            const ay = parseFloat(document.getElementById('ay').value);
            const az = parseFloat(document.getElementById('az').value);
            const bx = parseFloat(document.getElementById('bx').value);
            const by = parseFloat(document.getElementById('by').value);
            const bz = parseFloat(document.getElementById('bz').value);

            document.getElementById('val-ax').innerText = ax;
            document.getElementById('val-ay').innerText = ay;
            document.getElementById('val-az').innerText = az;
            document.getElementById('val-bx').innerText = bx;
            document.getElementById('val-by').innerText = by;
            document.getElementById('val-bz').innerText = bz;

            const vecA = new THREE.Vector3(ax, ay, az);
            const vecB = new THREE.Vector3(bx, by, bz);
            const vecRes = new THREE.Vector3().copy(vecA).cross(vecB);
            const vecSum = new THREE.Vector3().copy(vecA).add(vecB);

            // Update Arrows
            [ [arrowA, vecA], [arrowB, vecB], [arrowRes, vecRes] ].forEach(([arrow, vec]) => {
                const len = vec.length();
                if(len > 0.01) {
                    arrow.visible = true;
                    arrow.setDirection(vec.clone().normalize());
                    arrow.setLength(len, arrow === arrowRes ? 0.4 : 0.3, arrow === arrowRes ? 0.3 : 0.2);
                } else { arrow.visible = false; }
            });

            // Update Floating Labels
            if(vecA.length() > 0.1) {
                labelA.position.copy(vecA).add(vecA.clone().normalize().multiplyScalar(0.5));
                labelA.visible = true;
            } else { labelA.visible = false; }

            if(vecB.length() > 0.1) {
                labelB.position.copy(vecB).add(vecB.clone().normalize().multiplyScalar(0.5));
                labelB.visible = true;
            } else { labelB.visible = false; }

            // Update Parallelogram Vertices (Origin -> a -> a+b -> b)
            const vertices = new Float32Array([
                0,0,0,  ax,ay,az,  vecSum.x,vecSum.y,vecSum.z,
                0,0,0,  vecSum.x,vecSum.y,vecSum.z,  bx,by,bz
            ]);
            paraGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

            document.getElementById('result-coords').innerText = `(${vecRes.x.toFixed(1)}, ${vecRes.y.toFixed(1)}, ${vecRes.z.toFixed(1)})`;
            document.getElementById('result-mag').innerText = `Magnitude: ${vecRes.length().toFixed(2)}`;
        }

        // --- 5. EVENTS ---
        document.querySelectorAll('input[type=range]').forEach(i => i.addEventListener('input', updateVectors));
        window.addEventListener('resize', () => {
            camera.aspect = container.offsetWidth / container.offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.offsetWidth, container.offsetHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        updateVectors();
        animate();
    </script>
</body>
</html>
